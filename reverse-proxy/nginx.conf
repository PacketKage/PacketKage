# PacketKage behind nginx
#
# TLS termination + a correct Host header for PacketKage. The app uses
# PACKETKAGE_PUBLIC_URL (not the Host header) to build post-login redirects, so
# a hostile Host header cannot steer them — but forwarding it keeps cookies and
# logs accurate.
#
# Matching .env:
#   PACKETKAGE_PUBLIC_URL=https://packetkage.example.com
#   PACKETKAGE_OIDC_REDIRECT_URI=https://packetkage.example.com/api/auth/callback
# (the redirect URI must be registered verbatim on the Authentik provider)

upstream packetkage {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name packetkage.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name packetkage.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # PCAP uploads (default cap is 500 MB — keep this >= PACKETKAGE_MAX_UPLOAD).
    client_max_body_size 512m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Server-Sent Events (live job progress): disable buffering, allow long reads.
    location /api/jobs/ {
        proxy_pass http://packetkage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://packetkage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
