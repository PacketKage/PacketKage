<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>PacketKage</title>
    <script>
      // Apply saved theme before first paint (no flash of wrong theme)
      (function () {
        try {
          var saved = localStorage.getItem('packetkage-theme');
          var light =
            saved === 'light' ||
            (!saved && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.classList.add('light');
        } catch (e) {
          /* storage unavailable — stay dark */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
