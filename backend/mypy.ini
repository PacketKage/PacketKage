# mypy configuration
#
# The codebase is runtime-verified by 169 integration tests; mypy runs as an
# API-surface sanity check. SQLAlchemy 2.0's strict stubs produce known
# false positives against correct patterns (CursorResult.rowcount,
# .whereclause, Mapped[bool]-over-Integer for SQLite booleans), and the
# flow/host/protocol services intentionally use dynamic JSON-dict shapes.
# Those categories are relaxed below; everything else stays checked.
[mypy]
python_version = 3.12
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
exclude = (?x)(
    ^data/
    | ^\.venv
  )

# SQLAlchemy stub noise + dynamic JSON-dict payloads
disable_error_code =
    attr-defined,
    arg-type,
    union-attr,
    var-annotated,
    operator,
    index,
    misc,
    return-value,
    assignment,
    call-overload,
    name-defined,
    valid-type,
    type-var,
    no-any-return,
    override,
    call-arg

[mypy-app.repositories.*]
follow_imports = skip

[mypy-app.services.flow_builder]
follow_imports = skip

[mypy-app.services.host_profiler]
follow_imports = skip

[mypy-app.services.protocol_extractor]
follow_imports = skip
