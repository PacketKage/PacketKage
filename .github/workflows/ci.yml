name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow only checks out, builds, and tests code. Keep its token read-only.
permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff mypy pip-audit

      - name: pip-audit (vulnerable dependencies)
        # Fails the build on any known vulnerability in the exact pinned
        # backend dependency set (runtime + dev), including transitive deps.
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Generate synthetic test PCAPs
        run: python ../scripts/generate_test_pcaps.py --out ../test-data/synthetic

      - name: Ruff (lint)
        run: ruff check app/ tests/ ../scripts/

      - name: Mypy (type check)
        run: mypy app/

      - name: Pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend — lint, typecheck+build, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (vulnerable dependencies)
        # Fails the build on any known vulnerability at moderate severity or
        # higher in the frontend dependency tree (audits the full lockfile).
        run: npm audit --audit-level=moderate

      - name: Oxlint
        run: npm run lint

      - name: Typecheck + build
        run: npm run build

      - name: Vitest (unit)
        run: npm test

  e2e:
    name: End-to-end — Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate synthetic test PCAPs
        run: python ../scripts/generate_test_pcaps.py --out ../test-data/synthetic

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: packetkage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
